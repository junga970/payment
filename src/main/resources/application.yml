server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: payment-sync-outbox
  datasource:
    url: jdbc:mysql://localhost:3307/payment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  outbox:
    stream-key: payment:sync:stream   # Outbox 이벤트를 발행할 Redis Stream 키
    max-retry-count: 3                # 발행 실패 누적 시 FAILED 전환 기준
    poll-delay-ms: 1000               # Poller 실행 간격 (이전 실행 종료 후 대기)
    poller:
      enabled: true                   # false면 스케줄러 비활성화 (테스트에서 사용)
  sync:
    consumer:
      enabled: true                   # false면 컨슈머 비활성화 (테스트에서 사용)
      group: payment-sync-group
      name: consumer-1
      batch-size: 10
      poll-delay-ms: 1000
    dlq-key: payment:sync:dlq         # 최대 재시도 초과 메시지를 보내는 DLQ 스트림
    recovery:
      enabled: true                   # false면 Pending 복구 스케줄러 비활성화 (테스트에서 사용)
      poll-delay-ms: 3000
      min-idle-ms: 3000               # PEL에 이 시간 이상 머문 메시지만 회수
      max-delivery-count: 3           # 전달 횟수가 이 값에 도달하면 DLQ 이관

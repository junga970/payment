server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: payment-sync-outbox
  datasource:
    url: jdbc:mysql://localhost:3307/payment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
